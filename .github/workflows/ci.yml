name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and contract check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - name: EF Core models have migrations
        shell: bash
        run: |
          dotnet tool restore
          for project in src/Modules/*/Ovrilo.Modules.*/; do
            case "$project" in *.Contracts/) continue ;; esac
            # Modules without persistence (e.g. VoiceSessions) have no migrations to check.
            [ -d "${project}Persistence" ] || continue
            echo "Checking $project"
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project src/Ovrilo.Api --configuration Release --no-build
          done
      - name: OpenAPI contract is up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- openapi/; then
            echo "::error::openapi/ is out of date. Run 'dotnet build' and commit the regenerated contract."
            exit 1
          fi
